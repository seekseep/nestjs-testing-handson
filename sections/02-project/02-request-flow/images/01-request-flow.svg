<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="リクエストの流れ。画面（public/index.html）がエンドポイント（コントローラー）を HTTP で呼ぶ。メンバーを足すと MembersController が members の表に書き、立て替えを記録すると PaymentsController が payments と payment_participants の表に書く。清算を見ると SettlementController が立て替えを DB から読み、ロジックの split・balances・settle で計算して返す。DB を開くことも SQL も、コントローラーに直接書いてある">
<defs><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.h{font-size:22px;font-weight:700;fill:#0f172a}.t{font-size:20px;font-weight:700;fill:#0f172a}.s{font-size:14px;fill:#475569}.m{font-size:14px;fill:#1e293b;font-family:ui-monospace,Menlo,monospace}.b{font-size:15px;font-weight:700}.g{fill:#334155}.w{fill:#fff}.x{font-size:13px;fill:#64748b}</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fafc"/>

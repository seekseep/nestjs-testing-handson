<path d="M582 476 C 700 422, 830 422, 948 476" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="765" y="436" text-anchor="middle" class="x">SQL で立て替えを読む</text>
<rect x="640" y="480" width="250" height="60" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>

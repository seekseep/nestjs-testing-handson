<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="アプリは画面・エンドポイント・ロジック・DB の 4 つでできている。単体テスト（03 章）はロジックの計算の関数だけを確かめる。結合テスト（04 章）はテストのコードから HTTP でエンドポイント・ロジック・DB をまとめて確かめ、DB は一時ファイルにする。E2E テスト（05 章）は Podman で動かした画面から DB までをブラウザで確かめる。もっと単体テスト（06 章）は、リポジトリを偽物にしてサービスを確かめる">
<defs><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.h{font-size:22px;font-weight:700;fill:#0f172a}.t{font-size:20px;font-weight:700;fill:#0f172a}.s{font-size:14px;fill:#475569}.m{font-size:14px;fill:#1e293b;font-family:ui-monospace,Menlo,monospace}.b{font-size:15px;font-weight:700}.g{fill:#334155}.w{fill:#fff}.x{font-size:13px;fill:#64748b}</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1240" height="760" rx="20" fill="#f8fafc"/>
<text x="40" y="84" text-anchor="start" class="h">アプリの構成</text>
<text x="40" y="110" text-anchor="start" class="s">左から右へ呼び出す</text>
<rect x="300" y="50" width="180" height="84" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="390" y="84" text-anchor="middle" class="t">画面</text>
<text x="390" y="112" text-anchor="middle" class="m">index.html</text>
<rect x="540" y="50" width="180" height="84" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="630" y="84" text-anchor="middle" class="t">エンドポイント</text>
<text x="630" y="112" text-anchor="middle" class="m">コントローラー</text>
<rect x="780" y="50" width="180" height="84" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="870" y="84" text-anchor="middle" class="t">ロジック</text>
<text x="870" y="112" text-anchor="middle" class="m">計算・サービス</text>
<rect x="1020" y="50" width="180" height="84" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="1110" y="84" text-anchor="middle" class="t">DB</text>
<text x="1110" y="112" text-anchor="middle" class="m">SQLite</text>
<line x1="482" y1="92" x2="538" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="510" y="80" text-anchor="middle" class="x">HTTP</text>
<line x1="722" y1="92" x2="778" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="750" y="80" text-anchor="middle" class="x">呼び出す</text>
<line x1="962" y1="92" x2="1018" y2="92" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="990" y="80" text-anchor="middle" class="x">読み書き</text>
<line x1="40" y1="162" x2="1200" y2="162" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="190" width="8" height="40" rx="4" fill="#16a34a"/>
<text x="58" y="218" text-anchor="start" class="h">単体テスト</text>
<text x="40" y="252" class="m" style="fill:#475569">Vitest ・ 03 章</text>
<text x="40" y="276" text-anchor="start" class="s">計算の関数だけを、</text>
<text x="40" y="296" text-anchor="start" class="s">テストのコードから呼ぶ</text>
<rect x="540" y="192" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="630" y="221" text-anchor="middle" class="b g">テストのコード</text>
<rect x="780" y="192" width="180" height="46" rx="10" fill="#16a34a"/>
<text x="870" y="221" text-anchor="middle" class="b w">計算の関数だけ</text>
<rect x="40" y="318" width="8" height="40" rx="4" fill="#2563eb"/>
<text x="58" y="346" text-anchor="start" class="h">結合テスト</text>
<text x="40" y="380" class="m" style="fill:#475569">Vitest + supertest ・ 04 章</text>
<text x="40" y="404" text-anchor="start" class="s">アプリを丸ごと組み立て、</text>
<text x="40" y="424" text-anchor="start" class="s">HTTP で呼ぶ</text>
<rect x="300" y="320" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="390" y="349" text-anchor="middle" class="b g">テストのコード（HTTP）</text>
<rect x="540" y="320" width="660" height="46" rx="10" fill="#2563eb"/>
<text x="870" y="349" text-anchor="middle" class="b w">エンドポイント → ロジック → DB（一時ファイル）</text>
<rect x="40" y="446" width="8" height="40" rx="4" fill="#7c3aed"/>
<text x="58" y="474" text-anchor="start" class="h">E2E テスト</text>
<text x="40" y="508" class="m" style="fill:#475569">Playwright ・ 05 章</text>
<text x="40" y="532" text-anchor="start" class="s">Podman で動かした画面を</text>
<text x="40" y="552" text-anchor="start" class="s">ブラウザで操作する</text>
<rect x="300" y="448" width="900" height="46" rx="10" fill="#7c3aed"/>
<text x="750" y="477" text-anchor="middle" class="b w">ブラウザ → 画面 → エンドポイント → ロジック → DB</text>
<rect x="40" y="574" width="8" height="40" rx="4" fill="#16a34a"/>
<text x="58" y="602" text-anchor="start" class="h">もっと単体テスト</text>
<text x="40" y="636" class="m" style="fill:#475569">Vitest ・ 06 章</text>
<text x="40" y="660" text-anchor="start" class="s">DI で偽物のリポジトリを</text>
<text x="40" y="680" text-anchor="start" class="s">渡して、サービスを呼ぶ</text>
<rect x="540" y="576" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="630" y="605" text-anchor="middle" class="b g">テストのコード</text>
<rect x="780" y="576" width="180" height="46" rx="10" fill="#16a34a"/>
<text x="870" y="605" text-anchor="middle" class="b w">サービスと計算</text>
<rect x="1020" y="576" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="1110" y="605" text-anchor="middle" class="b g">偽物のリポジトリ</text>
<rect x="300" y="712" width="22" height="16" rx="4" fill="#475569"/>
<text x="330" y="726" text-anchor="start" class="s">色つき = 本物を動かして確かめる</text>
<rect x="600" y="712" width="22" height="16" rx="4" fill="#cbd5e1"/>
<text x="630" y="726" text-anchor="start" class="s">灰色 = テストのコードや偽物</text>
</svg>

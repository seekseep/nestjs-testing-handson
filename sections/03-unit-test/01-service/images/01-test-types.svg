<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="アプリはユーザー・エンドポイント・ロジック・DB の 4 つでできている。単体テストはエンドポイントの AuthMiddleware だけ、またはロジックと DB の NotesService だけを確かめる。結合テストはテストのコードから HTTP でエンドポイント・ロジック・DB をまとめて確かめる。E2E テストはユーザーのブラウザから DB までまとめて確かめる。どのテストでも、トークンの検証は偽物に置き換える">
<defs><style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.h{font-size:22px;font-weight:700;fill:#0f172a}.t{font-size:20px;font-weight:700;fill:#0f172a}.s{font-size:14px;fill:#475569}.m{font-size:14px;fill:#1e293b;font-family:ui-monospace,Menlo,monospace}.b{font-size:14px;font-weight:600}.w{fill:#fff}.g{fill:#334155}.x{font-size:13px;fill:#94a3b8}</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1200" height="790" rx="20" fill="#f8fafc"/>
<line x1="330.0" y1="176" x2="330.0" y2="720" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="580.0" y1="176" x2="580.0" y2="720" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="830.0" y1="176" x2="830.0" y2="720" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="1080.0" y1="176" x2="1080.0" y2="720" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6"/>
<text x="40" y="100" class="h">アプリの構成</text>
<text x="40" y="126" class="s">左から右へ呼び出す</text>
<rect x="240" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="330.0" y="98" text-anchor="middle" class="t">ユーザー</text>
<text x="330.0" y="128" text-anchor="middle" class="m">ブラウザ・curl</text>
<text x="330.0" y="152" text-anchor="middle" class="s">notes.html</text>
<rect x="490" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="580.0" y="98" text-anchor="middle" class="t">エンドポイント</text>
<text x="580.0" y="128" text-anchor="middle" class="m">AuthMiddleware</text>
<text x="580.0" y="152" text-anchor="middle" class="s">NotesController</text>
<rect x="740" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="830.0" y="98" text-anchor="middle" class="t">ロジック</text>
<text x="830.0" y="128" text-anchor="middle" class="m">NotesService</text>
<text x="830.0" y="152" text-anchor="middle" class="s">作った人だけ削除できる</text>
<rect x="990" y="60" width="180" height="116" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
<text x="1080.0" y="98" text-anchor="middle" class="t">DB</text>
<text x="1080.0" y="128" text-anchor="middle" class="m">ノートの保存先</text>
<text x="1080.0" y="152" text-anchor="middle" class="s">メモリ上の配列</text>
<line x1="422" y1="118" x2="488" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="455.0" y="108" text-anchor="middle" class="x">HTTP</text>
<line x1="672" y1="118" x2="738" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="705.0" y="108" text-anchor="middle" class="x">呼び出す</text>
<line x1="922" y1="118" x2="988" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
<text x="955.0" y="108" text-anchor="middle" class="x">読み書き</text>
<line x1="580.0" y1="176" x2="580.0" y2="206" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="490" y="206" width="180" height="58" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
<text x="580.0" y="231" text-anchor="middle" class="b g">トークンの検証</text>
<text x="580.0" y="252" text-anchor="middle" class="m" style="font-size:12px">TokenVerifier（Cognito）</text>
<text x="690" y="242" class="s">← テストでは、どれも偽物に置き換える</text>
<line x1="40" y1="296" x2="1160" y2="296" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="324" width="8" height="40" rx="4" fill="#16a34a"/>
<text x="58" y="352" class="h">単体テスト</text>
<text x="40" y="388" class="m" style="fill:#475569">Vitest ・ 03 章</text>
<text x="40" y="414" class="s">1 つのクラスだけを、</text>
<text x="40" y="434" class="s">テストのコードから直接呼ぶ</text>
<rect x="240" y="326" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="330.0" y="355" text-anchor="middle" class="b g">テストのコード</text>
<rect x="490" y="326" width="180" height="46" rx="10" fill="#16a34a"/>
<text x="580.0" y="355" text-anchor="middle" class="b w">AuthMiddleware だけ</text>
<rect x="740" y="326" width="430" height="46" rx="10" fill="#16a34a"/>
<text x="955.0" y="355" text-anchor="middle" class="b w">NotesService だけ</text>
<text x="580.0" y="402" text-anchor="middle" class="s">トークンの検証: 偽物（vi.fn）</text>
<rect x="40" y="459" width="8" height="40" rx="4" fill="#2563eb"/>
<text x="58" y="487" class="h">結合テスト</text>
<text x="40" y="523" class="m" style="fill:#475569">Vitest + supertest ・ 04 章</text>
<text x="40" y="549" class="s">アプリを丸ごと組み立て、</text>
<text x="40" y="569" class="s">HTTP で呼ぶ</text>
<rect x="240" y="461" width="180" height="46" rx="10" fill="#cbd5e1"/>
<text x="330.0" y="490" text-anchor="middle" class="b g">テストのコード（HTTP）</text>
<rect x="490" y="461" width="680" height="46" rx="10" fill="#2563eb"/>
<text x="830.0" y="490" text-anchor="middle" class="b w">エンドポイント → ロジック → DB</text>
<text x="580.0" y="537" text-anchor="middle" class="s">トークンの検証: 偽物（決め打ちのトークン）</text>
<rect x="40" y="594" width="8" height="40" rx="4" fill="#7c3aed"/>
<text x="58" y="622" class="h">E2E テスト</text>
<text x="40" y="658" class="m" style="fill:#475569">Playwright ・ 05 章</text>
<text x="40" y="684" class="s">ブラウザで画面を開き、</text>
<text x="40" y="704" class="s">画面から DB までまとめて</text>
<rect x="240" y="596" width="930" height="46" rx="10" fill="#7c3aed"/>
<text x="705.0" y="625" text-anchor="middle" class="b w">ブラウザ → エンドポイント → ロジック → DB</text>
<text x="580.0" y="672" text-anchor="middle" class="s">トークンの検証: 偽物（決め打ちのトークン）</text>
<rect x="240" y="740" width="22" height="16" rx="4" fill="#475569"/><text x="270" y="754" class="s">色つき = 本物を動かして確かめる</text>
<rect x="520" y="740" width="22" height="16" rx="4" fill="#cbd5e1"/><text x="550" y="754" class="s">灰色 = テストのコードや偽物に置き換える</text>
</svg>
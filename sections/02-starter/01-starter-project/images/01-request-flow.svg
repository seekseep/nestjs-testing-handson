<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="リクエストの流れ。作成（POST）と削除（DELETE）は、AuthMiddleware が TokenVerifier でトークンを確かめてから NotesController に届く。一覧（GET）はトークンなしで NotesController に届く。NotesService が作った人かを確かめる">
<defs>
<style>text{font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif}.t{font-size:17px;font-weight:700;fill:#0f172a}.s{font-size:13px;fill:#475569}.m{font-size:13px;fill:#1e293b;font-family:ui-monospace,Menlo,monospace}.e{font-size:13px;fill:#b91c1c;font-weight:600}</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
</defs>
<rect width="960" height="330" rx="20" fill="#f8fafc"/>
<rect x="30" y="50" width="160" height="150" rx="12" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="110" y="85" text-anchor="middle" class="t">リクエスト</text>
<text x="110" y="115" text-anchor="middle" class="m">POST /notes</text>
<text x="110" y="137" text-anchor="middle" class="m">DELETE /notes/:id</text>
<text x="110" y="175" text-anchor="middle" class="m">GET /notes</text>
<rect x="220" y="30" width="710" height="190" rx="14" fill="#fff" stroke="#E0234E" stroke-width="2"/>
<text x="240" y="56" class="t" fill="#E0234E">API（NestJS）</text>
<rect x="240" y="75" width="190" height="85" rx="10" fill="#fde2e8"/>
<text x="335" y="102" text-anchor="middle" class="m">AuthMiddleware</text>
<text x="335" y="124" text-anchor="middle" class="s">トークンを確かめる</text>
<text x="335" y="145" text-anchor="middle" class="m">TokenVerifier</text>
<rect x="490" y="75" width="190" height="125" rx="10" fill="#fde2e8"/>
<text x="585" y="112" text-anchor="middle" class="m">NotesController</text>
<text x="585" y="134" text-anchor="middle" class="s">URL と処理を</text>
<text x="585" y="155" text-anchor="middle" class="s">結びつける</text>
<rect x="720" y="75" width="190" height="125" rx="10" fill="#fde2e8"/>
<text x="815" y="112" text-anchor="middle" class="m">NotesService</text>
<text x="815" y="134" text-anchor="middle" class="s">ノートを持つ・</text>
<text x="815" y="155" text-anchor="middle" class="s">作った人かを確かめる</text>
<line x1="190" y1="120" x2="236" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="430" y1="120" x2="486" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<line x1="190" y1="180" x2="486" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="335" y="196" text-anchor="middle" class="s">一覧はトークンなしで通る</text>
<line x1="680" y1="137" x2="716" y2="137" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="335" y="255" text-anchor="middle" class="e">401</text>
<text x="335" y="275" text-anchor="middle" class="s">トークンが無い・正しくない</text>
<text x="815" y="255" text-anchor="middle" class="e">403 / 404</text>
<text x="815" y="275" text-anchor="middle" class="s">ほかの人のノート / 無いノート</text>
<text x="30" y="312" class="s">それぞれの部品が断ると、そこで止まってエラーを返す</text>
</svg>
